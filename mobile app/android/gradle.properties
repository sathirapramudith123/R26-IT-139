# Disables the Kotlin incremental compiler — works around a Windows-only bug
# where it crashes trying to relativize file paths across drives (e.g. the
# pub cache on C: vs the project on D:) or when a stale daemon still has a
# lock on the previous run's cache files. Slightly slower rebuilds, but
# reliable on this setup.
kotlin.incremental=false